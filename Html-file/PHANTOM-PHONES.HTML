<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avenzo | Phantom Phones</title>
    <!-- Link to the custom CSS stylesheet -->
    <link rel="stylesheet" href="../Css-file/PHANTOM-PHONES.CSS">
    <script src="../js-script/script.js" defer></script>
</head>
<body style="background-color: #f5f5f7; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

    <!-- TOP HEADER SECTION -->
    <div style="text-align: center; padding: 50px 20px 20px;">
        <a href="ECOM.HTML" style="color: #0066cc; text-decoration: none; font-size: 14px;">← Back to Home</a>
        <h1 style="font-size: 36px; font-weight: 700; color: #1d1d1f; margin: 15px 0 5px;">Avenzo Phantom Phones</h1>
        <p style="font-size: 17px; color: #6e6e73;">Choose your preferred device.</p>
    </div>

    <!-- PRODUCT CONTAINER (Grid layout for cards) -->
    <div class="phantom-container">
        
        <!-- PHONE CARD 1 -->
        <div class="phantom-card">
            <h2>Avenzo X1</h2>
            <p>Unmatched power in your hands.</p>
            
            <!-- 
              NOTE FOR NEXT DEVELOPER GELO: 
              To add an image here later, delete or comment out the 'image-space' div below, 
              and replace it with an <img> tag. 
              Example: <img src="../images-png/product1.png" alt="Avenzo X1" style="max-width: 180px; height: auto;">
            -->
            <div class="image-space"></div>

            <div class="price-tag">₱24,990</div>
            <button class="cart-btn">Add to Cart</button>
        </div>

        <!-- PHONE CARD 2 -->
        <div class="phantom-card">
            <h2>Avenzo X1 Pro</h2>
            <p>Designed for ultimate speed.</p>
            
            <!-- 
              NOTE FOR NEXT DEVELOPER GELO: 
              Swap this 'image-space' div with your <img> tag once the asset is ready.
              Example: <img src="../images-png/product2.png" alt="Avenzo X1 Pro" style="max-width: 180px; height: auto;">
            -->
            <div class="image-space"></div>

            <div class="price-tag">₱34,990</div>
            <button class="cart-btn">Add to Cart</button>
        </div>

        <!-- PHONE CARD 3 -->
        <div class="phantom-card">
            <h2>Avenzo Phantom 1</h2>
            <p>The pinnacle of mobile engineering.</p>
            
            <!-- 
              NOTE FOR NEXT DEVELOPER GELO: 
              Swap this 'image-space' div with your <img> tag once the asset is ready.
              Example: <img src="../images-png/produc3.png" alt="Avenzo Phantom 1" style="max-width: 180px; height: auto;">
            -->
            <div class="image-space"></div>

            <div class="price-tag">₱42,990</div>
            <button class="cart-btn">Add to Cart</button>
        </div>

    </div>

</body>
</html>
